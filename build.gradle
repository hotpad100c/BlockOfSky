plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

loom {

    mods {
        "sky" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "sky_smoke" {
            sourceSet sourceSets.smoke
        }
    }

    runs {
        smokeClient {
            client()
            name = "Smoke Client"
            source sourceSets.smoke
            runDir = "run/smoke"
            vmArg "-Djava.awt.headless=true"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    clientCompileOnly "maven.modrinth:${project.iris_fabric}"
    clientCompileOnly("io.github.douira:glsl-transformer:${project.glsl_transformer_version}") { transitive = false }
    for (mod in [project.iris_fabric, project.sodium_fabric]) {
        localRuntime "maven.modrinth:${mod}"
    }
    for (library in ["org.anarres:jcpp:1.4.14", "org.antlr:antlr4-runtime:4.13.1", "io.github.douira:glsl-transformer:${project.glsl_transformer_version}"]) {
        localRuntime(library) { transitive = false }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    smokeCompileClasspath.extendsFrom clientCompileClasspath
    smokeRuntimeClasspath.extendsFrom clientRuntimeClasspath
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}
