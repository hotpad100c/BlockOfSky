plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        sky_smoke {
            sourceSet(sourceSets.smoke)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }

        server {
            server()
            loadedMods = [mods."${mod_id}"]
            programArgument '--nogui'
        }

        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            loadedMods = [mods."${mod_id}", mods.sky_smoke]
            gameDirectory = project.file('run/smoke')
            jvmArgument '-Djava.awt.headless=true'
            systemProperty 'sky.smoke.tag', (project.findProperty('smokeTag') ?: 'run').toString()
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    smokeRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:${project.iris_neoforge}"
    localRuntime "maven.modrinth:${project.iris_neoforge}"
    localRuntime "maven.modrinth:${project.sodium_neoforge}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
